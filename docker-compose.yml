name: userbot-vk

services:
  userbot-vk:
    build: .
    env_file: .env
    volumes:
      - state:/app/state
    tmpfs:
      - /tmp:size=200m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.5
    mem_limit: 512m
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  state:
